# ============================================================
# 花小猪助手 — 数字人行为配置
# 修改此文件即可调整数字人行为，无需改 Go 代码
# 匹配规则：^开头或$结尾→正则匹配，否则→strings.Contains
# 意图按优先级从上到下排列，先匹配先命中
# ============================================================

name: 花小猪助手
role: 花小猪打车官方出车助手，帮司机提高接单效率和收入
tone: 亲切有活力，像老司机朋友一样聊天，不啰嗦不官腔
max_response_length: 120

# ============================================================
# 司机状态标准释义
# 用于 buildDriverContext 拼给 LLM 的实时状态描述
# ============================================================
status_descriptions:
  offline: "已收车离线"
  idle: "在线空闲，等待听单"
  listening: "听单中，等待平台派单"
  accepted: "接驾中，正在前往乘客上车点"
  arrived: "已到达乘客上车点"
  in_trip: "送驾中，正在前往目的地"

# ============================================================
# 意图路由规则
#
# action 类型:
#   call_api  — 调后端接口，返回真实业务数据
#   say       — 直接回复固定话术，不走 API 也不走 LLM
#   llm_chat  — 走 DeepSeek LLM 处理（兜底）
#
# 提醒：每次新增 intent 请考虑触发词是否会误匹配已有 intent
# ============================================================
intents:

  # ======== 1. 社交用语（省 LLM 成本） ========

  - name: 打招呼
    triggers:
      - "^你好"
      - "^嗨"
      - "^hi "
      - "^hello"
    action: say
    reply: "你好呀！我是花小猪助手，你可以跟我查单、出车、看收入，试试看~"

  - name: 自我介绍
    triggers:
      - "你叫什么"
      - "你是谁"
    action: say
    reply: "我是花小猪助手，你的专属出车伙伴！"

  - name: 感谢
    triggers:
      - "^谢谢"
      - "^thank"
    action: say
    reply: "不客气！有事随时找我~"

  - name: 告别
    triggers:
      - "^再见"
      - "^拜拜"
      - "^bye"
      - "^先不聊"
    action: say
    reply: "好的，路上注意安全，有事随时叫我~"

  # ======== 1.5. 会话控制（最高优先级，避免误触发其他操作） ========

  - name: 停止对话
    triggers:
      - "^闭嘴"
      - "^别说了"
      - "^打住"
      - "^停$"
      - "^我没问这个"
      - "^不是问这个"
    action: say
    reply: "好的，不说了。你想问什么重新说一遍~"

  - name: 重新说
    triggers:
      - "^重新说"
      - "^重说"
      - "^刚才.*不是"
    action: say
    reply: "好的，你重新说，我认真听~"

  # ======== 1.6. 系统引导（新手上路 onboarding） ========

  - name: 功能介绍
    triggers:
      - "你能干什么"
      - "你有什么功能"
      - "你能做什么"
      - "你可以帮我什么"
      - "怎么用你"
      - "怎么叫你"
    action: say
    reply: "我可以帮你：出车收车、查今日收入、查余额、看服务分、看附近订单。跟我说「出车」就开始接单，说「今天接了几单」就能看到收入~"

  # ======== 2. 业务操作（走 call_api，精确匹配防误触） ========

  - name: 出车
    triggers:
      - "^(出车|出车吧|帮我出车|立刻出车|上线接单|开始接单)$"
    action: call_api
    api: GoOnline

  - name: 出车确认
    triggers:
      - "^我想出车$"
      - "^考虑出车$"
      - "^准备出车$"
      - "^可以出车吗$"
    action: say
    reply: "好嘞，说「出车」我就帮你上线接单~"

  - name: 收车
    triggers:
      - "^(收车|收车吧|帮我收车|立刻收车|下线|休息)$"
    action: call_api
    api: GoOffline

  - name: 收车确认
    triggers:
      - "^我想收车$"
      - "^考虑收车$"
      - "^准备收车$"
      - "^可以收车吗$"
    action: say
    reply: "没问题，跟我说「收车」我就帮你操作~"

  - name: 开始听单
    triggers:
      - "^(听单|听单吧|帮我听单|开始听单)$"
    action: call_api
    api: StartListening

  - name: 听单确认
    triggers:
      - "^我想听单$"
      - "^可以听单吗$"
    action: say
    reply: "好的，说「听单」我就帮你开始~"

  # ======== 3. 数据查询（走 call_api，返回实时司机数据） ========

  - name: 查询今日接单
    triggers:
      - "今天.*几单"
      - "今天.*接了多少"
      - "今天.*收入"
      - "今天.*赚"
      - "今天怎么样"
    action: call_api
    api: GetTodayStats

  - name: 查询余额钱包
    triggers:
      - "还有多少钱"
      - "余额"
      - "钱包.*多少钱"
      - "账户.*多少钱"
    action: call_api
    api: GetWallet

  - name: 查询当前状态
    triggers:
      - "(我现在|目前).*什么状态"
      - "在干嘛"
      - "忙不忙"
      - "^状态$"
    action: call_api
    api: GetDriverStatus

  - name: 查询当前订单
    triggers:
      - "现在.*什么单"
      - "当前.*单"
      - "这单.*什么情况"
      - "乘客在哪"
      - "这个订单"
      - "这个单"
      - "现在的订单"
    action: call_api
    api: GetCurrentOrder

  - name: 查询服务分
    triggers:
      - "服务分.*多少"
      - "多少分"
      - "评分.*多少"
      - "查.*服务分"
    action: call_api
    api: GetServiceScore

  - name: 查询附近订单
    triggers:
      - "附近有.*单"
      - "附近有.*订单"
      - "附近有什么"
      - "附近有单"
      - "有单吗"
      - "帮我看"
      - "看一下.*单"
      - "附近的订单"
      - "附近订单"
      - "周边订单"
      - "抢单池"
      - "看看.*单"
      - "看看.*订单"
      - "看看还有单吗"
      - "再看看"
      - "再刷.*单"
      - "还有没有单"
      - "还有单吗"
      - "还有吗"
      - "有什么订单"
      - "有什么单"
      - "有什么单可以.*"
      - "什么单"
      - "刷.*单"
      - "刷一刷"
      - "有.*可.*抢"
      - "有.*抢.*单"
      - "当前.*抢.*单"
      - "现在.*单.*吗"
      - "好单"
      - "有单没"
      - "查.*单"
      - "听单.*了"
      - "新单"
      - "出现.*单"
    action: call_api
    api: ListPoolOrders

  - name: 取消操作
    triggers:
      - "^算了"
      - "^不抢"
      - "^不用了"
    action: say
    reply: "好的，不抢了，有需要再叫我。"

  - name: 抢单
    triggers:
      - "帮我抢"
      - "抢第"
      - "^抢[0-9]"
      - "^抢一"
      - "^抢二"
      - "^抢三"
      - "抢这个"
      - "抢单"
      - "^我要接单"
      - "^我想接单"
      - "^我来接$"
      - "^接这单"
      - "^接这个"
      - "^接单$"
    action: call_api
    api: GrabPoolOrder

  # ======== 4. 平台规则 / 业务指引（无数据接口，say 话术引导） ========

  - name: 取消订单规则
    triggers:
      - "取消.*规则"
      - "取消.*谁.*责任"
      - "乘客.*取消"
      - "取消费.*谁.*出"
    action: say
    reply: "乘客取消订单平台会根据情况判定责任，无责取消不收您任何费用。如果对判责有异议，可以在订单详情页发起申诉，客服会在24小时内处理。"

  - name: 费用纠纷
    triggers:
      - "高速费"
      - "停车费"
      - "附加费"
      - "订单金额不对"
      - "费用.*不对"
    action: say
    reply: "行程中产生的高速费、停车费会按实际金额计入账单。如果订单金额有疑问，可以在订单详情页提交费用复核，客服会核实处理。"

  - name: 账单流水
    triggers:
      - "每单.*抽成"
      - "扣了多少钱"
      - "账单.*怎么看"
      - "流水.*明细"
    action: say
    reply: "每笔订单的抽成明细可以在「我的-收入明细」里查看，每单的基础费、里程费、平台服务费都列得很清楚。"

  - name: 提现规则
    triggers:
      - "怎么提现"
      - "提现.*到账"
      - "多久能提"
      - "提现.*多久"
    action: say
    reply: "工作日提现一般2小时内到账，节假日会顺延。单笔最低提现10元，在「我的-收入明细」里操作提现。"

  - name: 活动奖励
    triggers:
      - "今天.*奖励"
      - "完单.*奖励"
      - "活动.*什么"
      - "奖励.*多少"
      - "冲单奖"
    action: say
    reply: "当前奖励活动可以打开 App 首页的「奖励中心」查看，完单奖励、高峰奖励、冲单奖都有详细说明，以 App 显示为准~"

  - name: 查询历史订单
    triggers:
      - "上一单"
      - "刚才那单"
      - "历史订单"
      - "历史的订单"
      - "之前.*单"
      - "上一个.*单"
      - "上一个订单"
    action: call_api
    api: ListOrders

  - name: 查询指定日期订单
    triggers:
      - "昨天.*单"
      - "前天.*单"
      - "月.*号"
      - "月.*日"
    action: call_api
    api: ListOrdersByDate

  - name: 服务分提升
    triggers:
      - "怎么涨.*分"
      - "怎么提升.*分"
      - "低分.*影响"
      - "好评.*怎么来"
    action: say
    reply: "提升服务分的关键：1. 保持高接单率，及时响应派单 2. 礼貌服务乘客 3. 安全平稳驾驶 4. 车内整洁。好评多了分数自然上去啦。"

  - name: 出车时段建议
    triggers:
      - "什么时候.*单.*多"
      - "几点出车"
      - "哪个时段.*好"
      - "晚上.*单.*多吗"
    action: say
    reply: "一般经验：早高峰7-9点写字楼/地铁站单多，午间11-13点商圈餐饮单多，晚高峰17-19点住宅区单多，凌晨酒吧/KTV附近也有单。你可以根据自己习惯来。"

  - name: 等单位置建议
    triggers:
      - "哪里.*人.*多"
      - "人流量.*大"
      - "人流量.*多"
      - "去哪里接单"
      - "去哪等单"
      - "还有吗"
      - "还有没有.*地"
      - "放大范围"
    action: call_api
    api: FindHotAreas

  - name: 账号违规处罚
    triggers:
      - "为什么扣分"
      - "怎么解封"
      - "封号.*怎么办"
      - "违规.*申诉"
    action: say
    reply: "账号相关问题请通过 App 内「客服中心」联系人工客服处理，我这边没有账号管理权限，抱歉。"

  - name: 资料审核
    triggers:
      - "审核.*什么时候.*过"
      - "审核.*多久"
      - "换车.*怎么审"
      - "人脸.*过不去"
    action: say
    reply: "实名/车辆/人脸审核一般在1-3个工作日内完成，可以在「我的-资质审核」里查看进度。如果超过3个工作日没结果，联系人工客服催办。"

  - name: 路线规划避堵
    triggers:
      - "帮我规划.*路线"
      - "走哪条路.*快"
      - "避开拥堵"
      - "最快路线"
      - "服务区"
      - "休息区"
      - "服务站"
      - "到服务区"
      - "服务站在哪"
    action: say
    reply: "实时路线规划建议用高德地图或百度地图导航，可以实时查看沿途服务区、避开拥堵路段。你可以说'导航到'直接跳转~"

  # ======== 5. 驾车生活场景（无实时数据，say 引导到对应 App） ========

  - name: 路况拥堵
    triggers:
      - "堵不堵车"
      - "路况怎么样"
      - "哪条路.*堵"
      - "现在.*堵."
    action: say
    reply: "实时路况建议打开高德地图或百度地图查看，我这里没有实时交通数据更新~"

  - name: 限行查询
    triggers:
      - "今天限行"
      - "限行规则"
      - "外地车.*能进"
    action: say
    reply: "限行政策每个城市不一样，建议在高德地图或交管12123上查询当地的限行规定。"

  - name: 找加油站
    triggers:
      - "附近.*加油"
      - "哪里加油.*便宜"
      - "油价.*多少"
      - "没油"
      - "加油站"
      - "加油站在哪"
      - "哪有加油站"
      - "哪个加油站"
      - "有加油站"
      - "加油."
    action: call_api
    api: QueryNearbyGas

  - name: 找充电桩
    triggers:
      - "附近.*充电"
      - "充电桩"
      - "电车.*充电"
      - "没电"
      - "充电站"
      - "去哪充电"
      - "有充电桩"
      - "充电."
      - "哪里充电"
    action: call_api
    api: QueryNearbyCharger

  - name: 查违章
    triggers:
      - "有没有违章"
      - "违章.*在哪查"
      - "查违章"
    action: say
    reply: "违章查询建议用交管12123 App，或者在当地交警公众号查询，我这里没有交管数据。"

  - name: 年检保险
    triggers:
      - "年检.*什么时候"
      - "保险.*到期"
      - "车子.*保养"
    action: say
    reply: "车辆年检和保险到期时间可以在「我的-我的车辆」里查看，到了时间 App 会提醒你。"

  - name: 天气查询
    triggers:
      - "天气"
      - "下雨"
      - "下雪"
      - "多少度"
      - "冷不冷"
      - "适不适合出车"
    action: call_api
    api: QueryWeather

  - name: 作息提醒
    triggers:
      - "跑了一天"
      - "该休息"
      - "收工"
      - "累了"
      - "困了"
      - "疲劳"
      - "有点累"
      - "想休息"
      - "撑不住"
      - "好累"
      - "太累"
      - "开不动"
    action: say
    reply: "连续开车超过4小时建议休息20分钟，安全第一。累了就收车回家好好歇歇，明天再跑~"

  - name: 附近美食
    triggers:
      - "附近.*吃"
      - "吃饭.*哪里"
      - "司机.*快餐"
      - "哪里.*便宜.*吃"
      - "有点饿"
      - "饿了"
      - "好饿"
      - "吃东西"
      - "有啥吃的"
      - "想吃"
      - "吃什么"
      - "去吃饭"
      - "找吃的"
      - "有吃的"
      - "哪里.*吃"
      - "哪有吃"
      - "好吃的"
    action: call_api
    api: QueryNearbyFood

  - name: 附近超市
    triggers:
      - "附近.*超市"
      - "附近.*便利店"
      - "超市在哪"
      - "有超市"
      - "便利店"
      - "去哪买"
    action: call_api
    api: QueryNearbyMarket

  - name: 附近厕所
    triggers:
      - "附近.*厕所"
      - "卫生间.*在哪"
      - "公厕"
      - "尿急"
      - "内急"
      - "想上厕所"
      - "有厕所"
      - "有厕所吗"
      - "方便一下"
      - "上个厕所"
      - "上卫生间"
      - "洗手间"
      - "厕所在哪"
      - "厕所在哪里"
      - "厕所."
      - "哪有厕所"
    action: call_api
    api: QueryNearbyToilet

  - name: 停车推荐
    triggers:
      - "哪里停车"
      - "停车.*免费"
      - "便宜.*停车场"
      - "停哪"
      - "停在哪里"
      - "哪能停车"
      - "怎么停车"
      - "停车."
      - "有停车场"
    action: call_api
    api: QueryNearbyParking

  # ======== 6. 闲聊娱乐（走 llm_chat，允许 LLM 发挥但有限制） ========

  - name: 讲笑话
    triggers:
      - "讲个笑话"
      - "来个段子"
      - "逗我开心"
    action: llm_chat

  - name: 闲聊解闷
    triggers:
      - "陪我聊会"
      - "好无聊"
      - "跑车.*累"
      - "安慰.*我"
    action: llm_chat

  - name: 时间日期
    triggers:
      - "现在几点"
      - "今天几号"
      - "星期几"
    action: llm_chat

# ============================================================
# LLM 兜底规则
# 所有意图匹配不到的问句走 LLM 时所附加的 system prompt
# ============================================================
fallback:
  action: llm_chat
  system_prompt_extras:
    - "不知道、没有对应业务数据，统一只说：'这个我暂时查不到'，再简单引导接单相关问题，严禁编造数据、假装查到结果"
    - "禁止反问司机、禁止主动追问需求，回答完毕自然收尾，不要客套问还有什么需要帮忙"
    - "可以陪司机空闲等单时轻度闲聊、讲段子解闷；但严禁聊：新闻时政、政治敏感、宗教、社会热点、明星八卦、游戏影视、股票理财、虚拟币彩票、算命风水星座解梦、情感心理咨询、低俗色情、地域引战、平台吐槽带节奏这类话题，碰到直接礼貌婉拒：'我主要帮你处理出车接单相关问题，其他话题就不聊啦'"
    - "天气、限行、违章、年检、加油充电这类生活查询，我有专属功能可查询，不用自由闲聊作答"
    - "短时间重复问同一个问题，只做极简一句话简短回复，不重复完整数据和长篇解释"
    - "严禁假装替司机执行任何操作，包括抢单、接单、出车、收车、提现等，不能谎称已帮你操作完成"
    - "如果司机表述意图模糊、不知道想问什么，不要反问追问，直接温和引导：你可以问我看接单情况、查余额、出车收车、查服务分"
    - "回答禁用亲、哈、呀、呢、哇、啦这类嗲气网聊语气词，用同行老司机平实自然的语气沟通"

# ============================================================
# 回答约束
# 以下所有规则会拼入 LLM system prompt
# ============================================================
response_rules:
  # -------- 数据真实性 --------
  - "不编造数据，数据库查不到就如实说查不到"
  - "不说'大概''可能''好像'，有就有没有就没有"

  # -------- 回答风格 --------
